name: Documentation

# Builds and deploys the documentation site. The signed in-app update feeds are
# not part of it: they live in the separate maxfield-allison/platefold-updates
# repository, which GitHub Pages serves from its own main branch. The job that
# re-signs them daily can write to that repository only, never to this one.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "platefold/**"
      - "SECURITY.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "uv.lock"
      - "tools/build_brand_assets.py"
      - "tools/build_docs_sample.py"
      - "tools/check_docs_site.py"
      - "tools/docs_reference.py"
      - "tools/prepare_docs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
      - name: Install the locked project and documentation tools
        run: |
          uv sync --locked --all-extras
          uv pip install -r requirements-docs.txt
      - name: Build and inspect documentation
        run: |
          uv run --no-sync python tools/prepare_docs.py
          uv run --no-sync zensical build --clean --strict
          uv run --no-sync python tools/check_docs_site.py site --sources build/docs-site
          uv run --no-sync python tools/build_brand_assets.py --check
          uv run --no-sync python tools/build_docs_sample.py --inspect
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
